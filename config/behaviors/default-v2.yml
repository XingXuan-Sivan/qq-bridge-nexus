# 二代仿真默认行为档案。
# 只描述 QQ 交互节奏（唤醒、发送、等待、主动、表情、上下文、反馈）；
# 运行模式、模型、准入与安全上限属于系统层，不放在这里。
version: 1
kind: v2
label: 二代仿真默认行为
description: reserved2 的默认节奏：AI 自主决定看、回、潜水和发表情。
v2:
  autoReplyCheckMs: 30000
  provideRecommendations: true
  wake:
    defaultMode: diving
    preSleepWaitEnabled: true
    preSleepWaitMs: 300000
    recommendedDefaultInfinite: true
    sleepMinMs: 60000
    sleepMaxMs: 0
    recommendedSleepMinMs: 300000
    recommendedSleepMaxMs: 7200000
    recommendedProbability: 0.05
    recommendedKeywords:
      - 小鲸鱼
      - DeepSeek
      - deepseek
      - DS
      - D老师
      - d老师
      - D指导
      - d指导
      - D师傅
      - d师傅
      - 深度求索
      - 大肥鱼
      - 鲸鱼
      - DeepSeek V3
      - DeepSeek R1
      - R1
    recommendedAtMention: true
    recommendedNameMention: true
    recommendedQuestion: true
    recommendedPoke: true
    recommendedHint: 如果你要潜水，推荐先调用 qq_wait_for_messages(timeoutMs=300000) 完成一次沉睡前观察；5 分钟内没人说话就可以设置下一次唤醒并沉睡。
    batchWindowMs: 8000
    maxWakePerMinute: 1
    maxWakePerHour: 12
    noActionLimit: 3
    maxWakeConfigReminders: 2
  send:
    burstEnabled: true
    burstMaxMessages: 8
    burstIntervalMinMs: 1000
    burstIntervalMaxMs: 3000
    longGapProbability: 0.2
    longGapMinMs: 5000
    longGapMaxMs: 10000
    maxMessageChars: 500
    maxGapMs: 10000
    gapBaseMs: 800
    gapPerCharMs: 20
    recommendedHint: 普通闲聊建议一次 1~3 条，条间 1~3 秒；讲故事/回忆可以 5~10 秒间隔；不要连续刷屏。
  wait:
    defaultMs: 30000
    minMs: 5000
    maxMs: 600000
    defaultQuietMs: 8000
    minQuietAfterNewMs: 10000
  proactive:
    enabled: true
    checkIntervalMinMs: 1800000
    checkIntervalMaxMs: 5400000
    idleThresholdMs: 900000
    probability: 0.3
  sticker:
    enabled: true
    syncTtlMs: 60000
    maxListCount: 100
    includeInPrompt: true
    promptMaxStickers: 8
    maxBytes: 10485760
    collect:
      enabled: true
      maxPerMinute: 2
      maxPerHour: 10
      maxRemarkChars: 20
  context:
    recentLimit: 100
    unreadLimit: 30
    contextWindow: 20
    inlineWakeMessages: true
    wakeMessageLimit: 12
    wakeRecentLimit: 4
    wakeMaxChars: 6000
  feedback:
    maxLength: 500
    notifyOwnerOnError: false
