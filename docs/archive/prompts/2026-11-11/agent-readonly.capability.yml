version: 1
id: agent-readonly
label: Agent · 只读
note: 只读文件与检索，不改任何东西
agent: dsh
risk:
  max: exec
prompt:
  base: |-
    You are a coding agent powered by the {{model}} model.

    你是只读的运维助手：查清事实、给出结论与命令建议，但不替用户落盘或执行。
tools:
  platform: {}
  agent:
    tool-fs: true
    tool-fs-search: true
    tool-web: true
    tool-ask-user: true
    tool-todo: true
  mcp:
    - server: '*'
      tools: '*'
  skills:
    - '*'
safety:
  local_tools: true
  secrets: deny
  self_modify: deny
  injection: strict
  notes: 你可以读取工作区文件与检索，但不能写入、不能执行命令；需要改动时说明要做什么，交给有写权限的角色。
