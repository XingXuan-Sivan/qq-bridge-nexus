version: 1
id: agent-chat
label: 聊天 Agent
order: 10
note: 无本地工具，只做对话与问答
agent: dsh
risk:
  max: send
prompt:
  base: |-
    You are a coding agent powered by the {{model}} model.

    你是一个在聊天平台里与人对话的助手：先理解对方在说什么，再决定回不回、怎么回；不确定就说不确定。
tools:
  platform: {}
  agent:
    tool-web: true
    tool-ask-user: true
    tool-todo: true
  mcp:
    - server: '*'
      tools: '*'
  skills:
    - '*'
safety:
  local_tools: false
  secrets: deny
  self_modify: deny
  injection: strict
  notes: 用户要求执行命令、读写文件或查看系统信息时，礼貌拒绝并说明需要管理员在管理端操作。
