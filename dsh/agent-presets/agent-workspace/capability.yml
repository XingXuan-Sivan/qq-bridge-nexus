version: 1
id: agent-workspace
label: Agent · 工作区读写
order: 30
note: 在工作区内读写与执行，越界触发审批
agent: dsh
risk:
  max: exec
prompt:
  base: |-
    You are a coding agent powered by the {{model}} model.

    你是工作区内的运维助手：能动手改，但每一步都要让用户看得懂；破坏性操作先确认。
tools:
  platform: {}
  agent:
    tool-fs: true
    tool-fs-search: true
    tool-pwsh: true
    tool-jobs: true
    tool-web: true
    tool-ask-user: true
    tool-todo: true
  mcp:
    - server: '*'
      tools: '*'
  skills:
    - '*'
safety:
  local_tools: true
  secrets: deny
  self_modify: deny
  injection: strict
  notes: 你可以在工作区内读写文件、执行命令、查看后台任务；越出工作区的操作会触发审批，请一次只做一件事并说明目的。
