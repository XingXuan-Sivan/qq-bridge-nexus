# 能力档（Agent 侧）：effects = 要哪些效果，behavior = 绑定的行为档案，
# runtime = 生效方式，audience = 可用受众，mcp / skills = 扩展授权。
# 由控制台平台详情的「能力」维护；插件行由该平台的渲染层生成，不在能力档里写。

version: 1
id: workspace
label: Agent · 工作区读写
note: 在工作区内读写与执行，越界触发审批
audience: owner
effects:
  fs.read: true
  fs.write: true
  fs.search: true
  shell.exec: true
  jobs.manage: true
  web.access: builtin
  user.ask: true
  todo.manage: true
  approval.gate: true
runtime:
  # 对端权限档：建会话时钉一次，之后随能力档走（与会话权限级别无关）。
  peerPermission: workspace-write
