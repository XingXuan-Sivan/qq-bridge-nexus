# 行为引擎定义（v2）：字段清单与默认值的唯一来源。
# 平台行为类型（profiles/platforms/<平台>/behavior-types/<kind>.yml）只写覆盖，不抄字段。
# 实例档案（behaviors/<id>.yml）是「默认值 + 覆盖」的全量快照，可重置回这里定义的内容。
label: 二代仿真行为
engine: v2
platform: qq
fields:
  - type: section
    card: true
    label: 自动回复
  - name: autoReplyCheckMs
    label: 自动回复检查间隔
    type: number
    step: any
    hint: 毫秒
    default: 30000
  - name: provideRecommendations
    label: 提供推荐值
    type: switch
    default: true
  - type: section
    card: true
    label: 唤醒
  - name: wake_defaultMode
    label: 默认潜水方式
    type: select
    options:
      - value: diving
        label: 潜水
      - value: active
        label: 活跃
    default: diving
  - name: wake_preSleepWaitEnabled
    label: 睡前观察
    type: switch
    default: true
  - name: wake_preSleepWaitMs
    label: 睡前观察时长
    type: number
    step: any
    hint: 毫秒
    default: 300000
  - name: wake_recommendedDefaultInfinite
    label: 推荐无限期潜水
    type: switch
    default: true
  - name: wake_sleepMinMs
    label: 潜水最短
    type: number
    step: any
    hint: 毫秒
    default: 60000
  - name: wake_sleepMaxMs
    label: 潜水最长
    type: number
    step: any
    hint: 毫秒；0 表示无限
    default: 0
  - name: wake_recommendedSleepMinMs
    label: 推荐潜水最短
    type: number
    step: any
    hint: 毫秒
    default: 300000
  - name: wake_recommendedSleepMaxMs
    label: 推荐潜水最长
    type: number
    step: any
    hint: 毫秒
    default: 7200000
  - name: wake_recommendedProbability
    label: 推荐唤醒概率
    type: number
    step: 0.01
    min: 0
    max: 1
    default: 0.05
  - name: wake_recommendedKeywords
    label: 推荐唤醒关键词
    type: textarea
    rows: 4
    list: true
    hint: 每行一个
    default:
      - 小鲸鱼
      - DeepSeek
      - deepseek
      - DS
      - D老师
      - d老师
      - D指导
      - d指导
      - D师傅
      - d师傅
      - 深度求索
      - 大肥鱼
      - 鲸鱼
      - DeepSeek V3
      - DeepSeek R1
      - R1
  - name: wake_recommendedAtMention
    label: 推荐：@ 唤醒
    type: switch
    default: true
  - name: wake_recommendedNameMention
    label: 推荐：名字唤醒
    type: switch
    default: true
  - name: wake_recommendedQuestion
    label: 推荐：提问唤醒
    type: switch
    default: true
  - name: wake_recommendedPoke
    label: 推荐：拍一拍唤醒
    type: switch
    default: true
  - name: wake_recommendedHint
    label: 唤醒推荐提示词
    type: textarea
    rows: 3
    default: 如果你要潜水，推荐先调用 qq_wait_for_messages(timeoutMs=300000) 完成一次沉睡前观察；5 分钟内没人说话就可以设置下一次唤醒并沉睡。
  - name: wake_noActionLimit
    label: 无动作上限
    type: number
    step: any
    default: 3
  - name: wake_maxWakeConfigReminders
    label: 唤醒配置提醒上限
    type: number
    step: any
    default: 2
  - type: section
    card: true
    label: 投递节奏
  - name: wake_adaptiveDebounce
    label: 动态合批
    type: switch
    default: true
  - name: wake_directBaseMs
    label: 点名基础等待
    type: number
    step: any
    hint: 毫秒
    default: 1200
  - name: wake_directMaxWaitMs
    label: 点名最长等待
    type: number
    step: any
    hint: 毫秒
    default: 3000
  - name: wake_ambientBaseMs
    label: 普通基础等待
    type: number
    step: any
    hint: 毫秒
    default: 4000
  - name: wake_ambientMaxWaitMs
    label: 普通最长等待
    type: number
    step: any
    hint: 毫秒
    default: 8000
  - name: wake_directBudgetCapacity
    label: 点名预算容量
    type: number
    step: any
    hint: 次；0 表示不限
    default: 3
  - name: wake_directRefillMs
    label: 点名预算回填间隔
    type: number
    step: any
    hint: 毫秒
    default: 20000
  - name: wake_ambientBudgetCapacity
    label: 普通预算容量
    type: number
    step: any
    hint: 次；0 表示不限
    default: 6
  - name: wake_ambientRefillMs
    label: 普通预算回填间隔
    type: number
    step: any
    hint: 毫秒
    default: 300000
  - name: wake_backlogEnabled
    label: 积压触达
    type: switch
    default: true
  - name: wake_backlogWakeAfter
    label: 积压触达阈值
    type: number
    step: any
    hint: 条
    default: 3
  - name: wake_backlogQuietMs
    label: 积压安静窗口
    type: number
    step: any
    hint: 毫秒
    default: 60000
  - type: section
    card: true
    label: 发送
  - name: send_burstEnabled
    label: 连发
    type: switch
    default: true
  - name: send_burstMaxMessages
    label: 连发最多条数
    type: number
    step: any
    default: 8
  - name: send_burstIntervalMinMs
    label: 连发最小间隔
    type: number
    step: any
    hint: 毫秒
    default: 1000
  - name: send_burstIntervalMaxMs
    label: 连发最大间隔
    type: number
    step: any
    hint: 毫秒
    default: 3000
  - name: send_longGapProbability
    label: 长停顿概率
    type: number
    step: 0.01
    min: 0
    max: 1
    default: 0.2
  - name: send_longGapMinMs
    label: 长停顿最小
    type: number
    step: any
    hint: 毫秒
    default: 5000
  - name: send_longGapMaxMs
    label: 长停顿最大
    type: number
    step: any
    hint: 毫秒
    default: 10000
  - name: send_maxMessageChars
    label: 单条最大字数
    type: number
    step: any
    default: 500
  - name: send_maxGapMs
    label: 条间最大间隔
    type: number
    step: any
    hint: 毫秒
    default: 10000
  - name: send_gapBaseMs
    label: 条间基础间隔
    type: number
    step: any
    hint: 毫秒
    default: 800
  - name: send_gapPerCharMs
    label: 每字追加间隔
    type: number
    step: any
    hint: 毫秒
    default: 20
  - name: send_recommendedHint
    label: 发送推荐提示词
    type: textarea
    rows: 3
    default: 普通闲聊建议一次 1~3 条，条间 1~3 秒；讲故事/回忆可以 5~10 秒间隔；不要连续刷屏。
  - type: section
    card: true
    label: 等待
  - name: wait_defaultMs
    label: 默认等待
    type: number
    step: any
    hint: 毫秒
    default: 30000
  - name: wait_minMs
    label: 最短等待
    type: number
    step: any
    hint: 毫秒
    default: 5000
  - name: wait_maxMs
    label: 最长等待
    type: number
    step: any
    hint: 毫秒
    default: 600000
  - name: wait_defaultQuietMs
    label: 默认静默窗口
    type: number
    step: any
    hint: 毫秒
    default: 8000
  - name: wait_minQuietAfterNewMs
    label: 新消息后最少静默
    type: number
    step: any
    hint: 毫秒
    default: 10000
  - type: section
    card: true
    label: 主动机会
  - name: proactive_enabled
    label: 主动机会
    type: switch
    default: true
  - name: proactive_checkIntervalMinMs
    label: 检查最小间隔
    type: number
    step: any
    hint: 毫秒
    default: 1800000
  - name: proactive_checkIntervalMaxMs
    label: 检查最大间隔
    type: number
    step: any
    hint: 毫秒
    default: 5400000
  - name: proactive_idleThresholdMs
    label: 空闲阈值
    type: number
    step: any
    hint: 毫秒
    default: 900000
  - name: proactive_probability
    label: 主动概率
    type: number
    step: 0.01
    min: 0
    max: 1
    default: 0.3
  - type: section
    card: true
    label: 表情
  - name: sticker_enabled
    label: 表情包
    type: switch
    default: true
  - name: sticker_syncTtlMs
    label: 同步缓存时长
    type: number
    step: any
    hint: 毫秒
    default: 60000
  - name: sticker_maxListCount
    label: 列表最多条数
    type: number
    step: any
    default: 100
  - name: sticker_includeInPrompt
    label: 写进提示词
    type: switch
    default: true
  - name: sticker_promptMaxStickers
    label: 提示词里最多表情
    type: number
    step: any
    default: 8
  - name: sticker_maxBytes
    label: 单个表情大小上限
    type: number
    step: any
    hint: 字节
    default: 10485760
  - name: sticker_collect_enabled
    label: 收藏表情
    type: switch
    default: true
  - name: sticker_collect_maxPerMinute
    label: 每分钟最多收藏
    type: number
    step: any
    default: 2
  - name: sticker_collect_maxPerHour
    label: 每小时最多收藏
    type: number
    step: any
    default: 10
  - name: sticker_collect_maxRemarkChars
    label: 收藏备注字数上限
    type: number
    step: any
    default: 20
  - type: section
    card: true
    label: 上下文
  - name: context_recentLimit
    label: 最近消息条数
    type: number
    step: any
    default: 100
  - name: context_unreadLimit
    label: 未读条数上限
    type: number
    step: any
    default: 30
  - name: context_contextWindow
    label: 上下文条数
    type: number
    step: any
    default: 20
  - name: context_inlineWakeMessages
    label: 唤醒消息内联
    type: switch
    default: true
  - name: context_wakeMessageLimit
    label: 唤醒消息条数
    type: number
    step: any
    default: 12
  - name: context_wakeRecentLimit
    label: 唤醒最近条数
    type: number
    step: any
    default: 4
  - name: context_wakeMaxChars
    label: 唤醒最大字符
    type: number
    step: any
    default: 6000
  - type: section
    card: true
    label: 反馈
  - name: feedback_maxLength
    label: 反馈最大长度
    type: number
    step: any
    default: 500
  - name: feedback_notifyOwnerOnError
    label: 出错通知 owner
    type: switch
    default: false
