# 能力档（跨 Agent 平台共用）：放在 profiles/capabilities/ 下，所有 Agent 平台都能选。
#
# 直通 = 不装环境、不装预设、不套沙箱，只做「追加」：提示注入、会话编排、平台工具。
# 它和 full / workspace 是同一类档位（同一套接口、同样可以被会话随便选），
# 唯一差别是不改执行体的环境 —— 会话跑在该 Agent 平台「手动新建一个会话」时的默认环境里。
# 所以 effects 留空：不声明效果就没有插件行要渲染，工具面交给执行体自己。
# 扩展授权也留空（= 全部拒绝）：四个 MCP 服务器由安装期写进执行体自己的配置
# （`adapters/install.mjs` 的 `# === qq-bridge MCP BEGIN ===` 区块），与预设无关，
# 不装预设也不会丢 MCP。

version: 1
id: direct
label: 直通
note: 不装环境，用 Agent 平台现成的会话环境、工具与权限；只附加本平台工具
runtime:
  apply: passthrough
  prompt: system
