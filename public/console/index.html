<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>QQ 桥接控制台</title>
<link rel="icon" href="/console/img/favicon.svg" type="image/svg+xml">
<script>
// 主题引导：须在样式表之前执行，避免首屏闪一下浅色。
(function () {
  var theme;
  try {
    var saved = localStorage.getItem('qq-console-theme');
    theme = saved === 'dark' || saved === 'light' ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (error) {
    theme = 'light';
  }
  document.documentElement.dataset.theme = theme;
})();
</script>
<link rel="stylesheet" href="/console/css/tokens.css">
<link rel="stylesheet" href="/console/css/base.css">
<link rel="stylesheet" href="/console/css/layout.css">
<link rel="stylesheet" href="/console/css/components.css">
</head>

  <div class="bg-decor" aria-hidden="true"></div>
  <a class="skip-link" href="#mainContent">跳到主要内容</a>

    <nav id="mainNav">
      <div class="nav-label">工作空间</div>

      <button data-view="sessions" class="nav-item"><span class="nav-icon" aria-hidden="true">☷</span>会话与审批<span class="nav-count" id="pendingCount">—</span></button>

      <div class="nav-label">扩展</div>
      <button data-view="plugins" class="nav-item"><span class="nav-icon" aria-hidden="true">⧉</span>插件</button>

      <button data-view="mcp" class="nav-item"><span class="nav-icon" aria-hidden="true">⇄</span>MCP</button>
      <button data-view="behaviors" class="nav-item"><span class="nav-icon" aria-hidden="true">⌥</span>管理行为</button>
      <div class="nav-label">聊天行为</div>
      <button data-view="social-v2" class="nav-item"><span class="nav-icon" aria-hidden="true">◈</span>二代仿真<span class="nav-note">V2</span></button>

    <header class="topbar">

    </header>
    <main id="mainContent" tabindex="-1">
      <div class="page-heading"><div><div class="eyebrow">QQ BRIDGE / CONSOLE</div><h1 id="pageTitle">让每一次连接，都自然发生。</h1><p id="pageDescription">掌握桥接状态，轻松管理你的 QQ 智能伙伴。</p></div>
        <div class="search-wrap"><label class="sr-only" for="consoleSearch">搜索功能或参数</label><input id="consoleSearch" type="search" placeholder="搜索功能或参数…" autocomplete="off" aria-controls="searchResults" aria-expanded="false"><div id="searchResults" class="search-results" hidden></div></div>

    </section>
<section id="section-reference" data-page="reference" class="card span-all">

<section id="section-access" data-page="access" class="page-stack">

<section id="section-operations" data-page="operations" class="page-stack"><!-- 片段：pages/operations/page.html（三张卡片：测试发送 / 桥接控制 / 后台控制端引导） --></section>

      </div>
      <div class="overview-footnote" data-page="overview"><span id="accessSummary">正在读取访问范围…</span><button class="text-button" data-view="access">管理访问范围 →</button></div>
      <footer class="page-footer"><span>QQ Bridge · 连接日常，保持自主</span><span id="lastUpdated">等待首次同步</span></footer>
    </main>
  </div>
      <div class="modal-overlay" id="slangModalOverlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="slangModalTitle" tabindex="-1">
        <h3 id="slangModalTitle">确认黑话</h3>
        <div class="meta" id="slangModalContent" style="margin-bottom:6px"></div>
        <div class="meta slang-guess" id="slangModalGuess" style="display:none;margin-bottom:6px"></div>
        <label>含义 *</label>
        <input type="text" id="slangModalMeaning" placeholder="必须填写，确认后才会注入 AI 上下文">
        <label>用法（可选）</label>
        <input type="text" id="slangModalUsage" placeholder="使用场景 / 语气">
        <label>示例（可选）</label>
        <input type="text" id="slangModalExample" placeholder="自然短句示例">
        <label>风险/慎用说明（可选）</label>
        <input type="text" id="slangModalRisk" placeholder="敏感 / 慎用风险">
        <label>参考来源（可选，每行一个 URL）</label>
        <textarea id="slangModalSources" rows="3" placeholder="https://..."></textarea>
        <div class="row">
          <button id="slangModalDirectConfirm" class="small">直接确认（转正）</button>
          <button id="slangModalSendResearch" class="small">送 DSH 深度研究</button>
          <button id="slangModalCancel" class="small">取消</button>
        </div>
