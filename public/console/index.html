<!doctype html>

<head>
<meta charset="utf-8">

<link rel="stylesheet" href="/console/css/tokens.css">
<link rel="stylesheet" href="/console/css/base.css">

<link rel="stylesheet" href="/console/components/time/time.css">

<body>
  <div class="bg-decor" aria-hidden="true"></div>
  <a class="skip-link" href="#mainContent">跳到主要内容</a>
  <aside class="sidebar" aria-label="控制台导航">
    <a href="#overview" class="brand"><span class="brand-mark" aria-hidden="true">q<span>↗</span></span><span>QQ Bridge<small>DeepSeek Harness 控制台</small></span></a>
    <nav id="mainNav">
      <div class="nav-label">管理</div>
      <button data-view="overview" class="nav-item active" aria-current="page"><span class="nav-icon" aria-hidden="true">◫</span>运行总览</button>
      <button data-view="sessions" class="nav-item"><span class="nav-icon" aria-hidden="true">☷</span>会话与审批<span class="nav-count" id="pendingCount" hidden></span></button>
      <button data-view="behavior" class="nav-item"><span class="nav-icon" aria-hidden="true">▣</span>平台配置</button>
      <button data-view="config" class="nav-item"><span class="nav-icon" aria-hidden="true">⚙</span>全局配置</button>
      <button data-view="operations" class="nav-item"><span class="nav-icon" aria-hidden="true">⌘</span>调试与运维</button>
      <div class="nav-label">聊天行为</div>
      <button data-view="prompt-blocks" class="nav-item"><span class="nav-icon" aria-hidden="true">❖</span>注入块</button>
      <button data-view="persona" class="nav-item"><span class="nav-icon nav-icon-persona" aria-hidden="true">♥</span>人格与角色</button>
      <button data-view="memory" class="nav-item"><span class="nav-icon" aria-hidden="true">◍</span>记忆</button>
      <button data-view="slang" class="nav-item"><span class="nav-icon" aria-hidden="true">▤</span>黑话词库</button>
      <button data-view="scheduler" class="nav-item"><span class="nav-icon" aria-hidden="true">◷</span>定时任务</button>
      <div class="nav-label">扩展</div>
      <button data-view="plugins" class="nav-item"><span class="nav-icon" aria-hidden="true">⧉</span>插件</button>
      <button data-view="skills" class="nav-item"><span class="nav-icon" aria-hidden="true">✦</span>技能</button>
      <button data-view="mcp" class="nav-item"><span class="nav-icon" aria-hidden="true">⇄</span>MCP</button>
      <button data-view="behaviors" class="nav-item"><span class="nav-icon" aria-hidden="true">⌥</span>命令</button>
    </nav>
    <div class="sidebar-bottom"><span class="local-dot"></span>本地控制台<small>QQ ↔ DeepSeek Harness</small></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb"><a class="crumb-link" href="#overview">管理</a><span class="crumb-sep" aria-hidden="true">/</span><span class="crumb-current" aria-current="page">运行总览</span></div>
      <div class="topbar-actions"><span class="status-badge" id="statusText" role="status">正在连接…</span><button id="themeToggle" class="icon-button" type="button" aria-label="切换深色模式" aria-pressed="false" title="切换深色 / 浅色主题">☾</button><button id="refreshConsole" class="icon-button" aria-label="刷新控制台状态" title="刷新状态">↻</button></div>
    </header>
    <main id="mainContent" tabindex="-1">
      <div class="page-heading"><div><div class="eyebrow">QQ BRIDGE / CONSOLE</div><h1 id="pageTitle">让每一次连接，都自然发生。</h1><p id="pageDescription">掌握桥接状态，轻松管理你的 QQ 智能伙伴。</p></div>
        <div class="search-wrap"><label class="sr-only" for="consoleSearch">搜索功能或参数</label><input id="consoleSearch" type="search" class="search-box" placeholder="搜索功能或参数…" autocomplete="off" aria-controls="searchResults" aria-expanded="false"><div id="searchResults" class="search-results" hidden></div></div>
      </div>
      <div id="connectionAlert" class="connection-alert" role="alert" hidden></div>
      <div class="grid">
        <section id="section-overview" data-page="overview" class="page-stack"><!-- 片段：pages/overview/page.html（摘要指标 / 活动日志） --></section>
<section id="section-config" data-page="config" class="page-stack"><!-- 片段：pages/config/page.html（全局配置六分区） --></section>
<section id="section-sessions" data-page="sessions" class="page-stack"><!-- 片段：pages/sessions/page.html（会话映射 / 挂起审批与提问） --></section>
<section id="section-persona" data-page="persona" class="page-stack"><!-- 人格与角色页内容由 pages/persona/page.html 注入。 --></section>
<section id="section-plugins" data-page="plugins" class="page-stack"><!-- 片段：pages/plugins/page.html（桥接插件 / 内置注入块 / 运行设置 / 安装） --></section>
    <section id="section-skills" data-page="skills" class="card span-all"></section>
    <section id="section-prompt-blocks" data-page="prompt-blocks" class="page-stack"><!-- 片段：pages/prompt-blocks/page.html（注入块清单 / 预算 / 预览） --></section>
    <section id="section-behavior" data-page="behavior" class="page-stack"><!-- 片段：pages/behavior/page.html（行为档案表单） --></section>
    <section id="section-mcp" data-page="mcp" class="card span-all"></section>
    <section id="section-behaviors" data-page="behaviors" class="card span-all"></section>
    <section id="section-memory" data-page="memory" class="page-stack"><!-- 片段：pages/memory/page.html（注入 / provider / 本机轻量记忆 / 工具 / 写回 / 最近活动） --></section>
    <section id="section-slang" data-page="slang" class="page-stack">
      <!-- 页面片段由路由器按需注入：pages/slang/page.html -->
    </section>
<section id="section-scheduler" data-page="scheduler" class="page-stack">
      <!-- 片段：pages/scheduler/page.html（进入该页时注入；多卡片：总开关 / 谁可以登记 / 安全限制 / 任务列表 / 执行记录） -->
    </section>
<section id="section-operations" data-page="operations" class="page-stack"><!-- 片段：pages/operations/page.html（三张卡片：测试发送 / 桥接控制 / 后台控制端引导） --></section>
      </div>
      <footer class="page-footer"><span>QQ Bridge · 连接日常，保持自主</span><span id="lastUpdated">等待首次同步</span></footer>
    </main>
  </div>
      <div class="modal-overlay" id="slangModalOverlay">
      <div class="modal" data-modal-panel role="dialog" aria-modal="true" aria-labelledby="slangModalTitle" tabindex="-1">
        <header class="modal-head">
          <h3 id="slangModalTitle">确认黑话</h3>
          <button class="modal-close" type="button" data-modal-close aria-label="关闭">×</button>
        </header>
        <div class="modal-body">
          <div class="meta u-mb-6" id="slangModalContent"></div>
          <div class="meta slang-guess u-mb-6" id="slangModalGuess" hidden></div>
          <label>含义 *</label>
          <input type="text" id="slangModalMeaning" placeholder="必须填写，确认后才会注入 AI 上下文">
          <label>用法（可选）</label>
          <input type="text" id="slangModalUsage" placeholder="使用场景 / 语气">
          <label>示例（可选）</label>
          <input type="text" id="slangModalExample" placeholder="自然短句示例">
          <label>风险/慎用说明（可选）</label>
          <input type="text" id="slangModalRisk" placeholder="敏感 / 慎用风险">
          <label>参考来源（可选，每行一个 URL）</label>
          <textarea id="slangModalSources" rows="3" placeholder="https://..."></textarea>
        </div>
        <footer class="modal-foot">
          <button id="slangModalSendResearch" class="btn">送 DSH 深度研究</button>
          <button id="slangModalCancel" class="btn" type="button">取消</button>
          <button id="slangModalDirectConfirm" class="btn primary" type="button">直接确认（转正）</button>
        </footer>
      </div>
    </div>


    <div class="modal-overlay" id="slangAddOverlay" aria-hidden="true">
      <div class="modal" data-modal-panel role="dialog" aria-modal="true" aria-labelledby="slangAddTitle" tabindex="-1">
        <header class="modal-head">
          <h3 id="slangAddTitle">手动添加黑话</h3>
          <button class="modal-close" type="button" data-modal-close aria-label="关闭">×</button>
        </header>
        <div class="modal-body" id="slangAddFields"></div>
        <footer class="modal-foot">
          <span class="modal-status" id="slangAddMsg"></span>
          <button class="btn" id="slangAddCancel" type="button">取消</button>
          <button class="btn primary" id="slangAdd" type="button">添加入库</button>
        </footer>
      </div>
    </div>


<div class="modal-overlay" id="schedEditorOverlay" aria-hidden="true">
      <div class="modal modal--wide" data-modal-panel role="dialog" aria-modal="true" aria-labelledby="schedEditorTitle" tabindex="-1">
        <header class="modal-head">
          <h3 id="schedEditorTitle">新建任务</h3>
          <button class="modal-close" type="button" data-modal-close aria-label="关闭">×</button>
        </header>
        <div class="modal-body" id="schedEditor">
          <div class="sched-form">
            <div class="field-block"><div class="field-row">
              <label class="field-label" for="schedName">名称</label>
              <div class="field-control"><input type="text" id="schedName" placeholder="早安"></div>
            </div></div>
            <div class="field-block"><div class="field-row">
              <label class="field-label" for="schedTaskTz">时区</label>
              <div class="field-control"><select id="schedTaskTz"></select></div>
            </div></div>
            <div class="field-block"><div class="field-row">
              <label class="field-label" for="schedType">重复方式</label>
              <div class="field-control"><select id="schedType">
            <option value="once">一次性</option>
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="workdays">工作日（周一至周五，跳过法定节假日）</option>
            <option value="monthly">每月几号</option>
            <option value="monthlyWeekday">每月第几个周几</option>
            <option value="yearly">每年</option>
            <option value="dates">特殊日期</option>
            <option value="everyNDays">每隔 N 天</option>
            <option value="interval">每隔 N 分钟</option>
            <option value="dailyRandom">每天随机几次</option>
            <option value="monthlyRandom">每月随机几次</option>
            <option value="cron">高级：cron 表达式</option>
          </select></div>
            </div></div>
            <div class="sched-fields" id="schedFields"></div>
            <div class="field-block"><div class="field-row">
              <span class="field-label">有效期（可选）</span>
              <div class="field-control field-inline">
                <span class="date-field">
                  <input type="text" class="date-field-text" id="schedStartDate" placeholder="YYYY-MM-DD" inputmode="numeric" autocomplete="off" aria-label="开始日期">
                  <button type="button" class="date-field-btn btn-icon" aria-label="选择开始日期">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="3.4" width="11.6" height="10.2" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.4 6.6h11.2M5.4 2.2v2.4M10.6 2.2v2.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                  </button>
                  <input type="date" class="date-field-native" data-date-native="schedStartDate" tabindex="-1" aria-hidden="true">
                </span>
                <span class="field-unit">～</span>
                <span class="date-field">
                  <input type="text" class="date-field-text" id="schedEndDate" placeholder="YYYY-MM-DD" inputmode="numeric" autocomplete="off" aria-label="结束日期">
                  <button type="button" class="date-field-btn btn-icon" aria-label="选择结束日期">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="3.4" width="11.6" height="10.2" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2.4 6.6h11.2M5.4 2.2v2.4M10.6 2.2v2.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                  </button>
                  <input type="date" class="date-field-native" data-date-native="schedEndDate" tabindex="-1" aria-hidden="true">
                </span>
              </div>
            </div></div>
            <div class="field-block"><div class="field-row">
              <label class="field-label" for="schedMaxRuns">共执行几次后停止</label>
              <div class="field-control"><input type="number" id="schedMaxRuns" min="1" placeholder="不限（可选）"></div>
            </div></div>
            <div class="field-block"><div class="field-row">
              <label class="field-label" for="schedExclude">排除日期</label>
              <div class="field-control"><input type="text" id="schedExclude" placeholder="可选，逗号分隔：2026-12-25, 2027-01-01"></div>
            </div></div>
            <div class="field-block field-block--switch"><div class="field-row">
              <span class="field-label">跳过法定节假日</span>
              <div class="field-control">
                <button type="button" class="field-switch" role="switch" id="schedSkipHolidays" data-field="schedSkipHolidays" data-on-label="开" data-off-label="关" aria-checked="false"><span class="field-switch-track" aria-hidden="true"></span><span>关</span></button>
              </div>
            </div></div>
            <div class="field-block"><div class="field-row">
              <label class="field-label" for="schedSilence">定时静默时段</label>
              <div class="field-control"><select id="schedSilence"><option value="skip">跳过这次</option><option value="run">照常执行</option></select></div>
            </div></div>
            <div class="field-block"><div class="field-row">
              <label class="field-label" for="schedMissed">错过了</label>
              <div class="field-control"><select id="schedMissed"><option value="grace">补发时间内补发，否则跳过</option><option value="skip">直接跳过</option></select></div>
            </div></div>
            <div class="field-block"><div class="field-row">
              <span class="field-label">发给谁</span>
              <div class="field-control sched-target-row">
                <span class="sched-target-summary" id="schedTargets">未选择</span>
                <button class="btn small" type="button" id="schedTargetPick">选择对象</button>
              </div>
            </div></div>
            <div class="field-block"><div class="field-row">
              <span class="field-label">内容形式</span>
              <div class="field-control field-inline">
                <label class="sched-chip u-m-0"><input type="radio" name="schedKind" value="text" checked> 固定文字（桥接直接发）</label>
                <label class="sched-chip u-m-0"><input type="radio" name="schedKind" value="ai"> 叫 AI 来说（到点唤醒 AI）</label>
              </div>
            </div></div>
            <div class="field-block" id="schedPluginKindRow" hidden><div class="field-row">
              <span class="field-label">插件任务类型</span>
              <div class="field-control field-inline">
                <select id="schedPluginKind"></select>
                <span class="field-unit">由插件注册；payload 见插件说明</span>
              </div>
            </div></div>
          <textarea id="schedPayloadJson" rows="3" class="u-w-full u-mt-8" hidden placeholder='{"payload": {"week": "周一"}}'></textarea>
            <div class="field-block field-block--textarea"><div class="field-row">
              <label class="field-label" for="schedContent">内容</label>
              <div class="field-control"><textarea id="schedContent" rows="3" placeholder="早上好"></textarea></div>
            </div>
              <div class="field-notes"><p class="field-hint" id="schedPreview">接下来：—</p></div>
            </div>
          </div>
        </div>
        <footer class="modal-foot">
          <span class="modal-status" id="schedEditorMsg"></span>
          <button class="btn" type="button" id="schedCancel">取消</button>
          <button class="btn primary" type="button" id="schedSave">保存任务</button>
        </footer>
      </div>
    </div>

  <noscript><div class="connection-alert">控制台需要启用 JavaScript 才能加载状态及保存设置。</div></noscript>

<script src="/console/components/code-editor/vendor/codemirror.js"></script>
<script type="module" src="/console/js/app.js"></script>
</body>
</html>
