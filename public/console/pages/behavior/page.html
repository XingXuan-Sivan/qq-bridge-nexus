<section class="page-stack behavior-page">
  <div class="page-tabs" role="tablist">
    <button class="page-tab active" type="button" role="tab" aria-selected="true" data-behavior-tab="platform">平台</button>
    <button class="page-tab" type="button" role="tab" aria-selected="false" data-behavior-tab="plans">运行方案</button>
    <button class="page-tab" type="button" role="tab" aria-selected="false" data-behavior-tab="behaviors">行为档案</button>
    <button class="page-tab" type="button" role="tab" aria-selected="false" data-behavior-tab="capabilities">能力预设</button>
  </div>

  <!-- 卡片外壳由 page.js 的 renderCards() 用 components/card 生成；面板里只留卡片宿主。
       宿主是 .page-stack（display:contents），生成的 section 直接成为 main 网格项。
       面板里非卡片的挂载点（#behaviorFormPanel、#capabilityEditor）仍留在各自面板里，
       需要保持顺序的地方拆成前后两个宿主（文档卡 → 表单组 → 提示词卡）。 -->
  <div class="page-stack" data-behavior-panel="platform">
    <div id="behaviorPlatformCards" class="page-stack"></div>
  </div>

  <div class="page-stack" data-behavior-panel="plans" hidden>
    <div id="behaviorPlansCards" class="page-stack"></div>
  </div>

  <div class="page-stack" data-behavior-panel="behaviors" hidden>
    <div id="behaviorDocCards" class="page-stack"></div>
    <div id="behaviorFormPanel" class="behavior-groups"></div>
    <div id="behaviorPromptCards" class="page-stack"></div>
  </div>

  <div class="page-stack" data-behavior-panel="capabilities" hidden>
    <div id="behaviorCapabilityCards" class="page-stack"></div>
    <div id="capabilityEditor" class="behavior-groups" hidden></div>
  </div>
</section>
