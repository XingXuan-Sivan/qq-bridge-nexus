<div class="config-layout">
  <div class="page-tabs config-tabs" role="tablist" aria-label="全局配置分区">
    <button type="button" class="page-tab active" role="tab" aria-selected="true" data-config-section="runtime">行为与模型</button>
    <button type="button" class="page-tab" role="tab" aria-selected="false" data-config-section="access">准入</button>
    <button type="button" class="page-tab" role="tab" aria-selected="false" data-config-section="security">安全</button>
    <button type="button" class="page-tab" role="tab" aria-selected="false" data-config-section="voice">扩展功能</button>
  </div>
  <!-- 卡片外壳由 page.js 的 renderCards() 用 components/card 生成，这里只留每个面板的宿主。
       宿主用 .page-stack（display:contents）：生成的 section 直接成为 .config-panel 的 flex 子项，
       面板间距仍由 .config-panel 的 gap 决定，注入前后布局一致。 -->
  <div class="config-body">
    <section class="config-panel active" data-config-panel="runtime">
      <div id="configRuntimeCards" class="page-stack"></div>
    </section>

    <section class="config-panel" data-config-panel="security" hidden>
      <div id="configSecurityCards" class="page-stack"></div>
    </section>

    <section class="config-panel" data-config-panel="access" hidden>
      <div id="configAccessCards" class="page-stack"></div>
    </section>

    <!-- 扩展功能没有静态卡片：voice-section.js 自己往 #voicePanel 里挂载。 -->
    <section class="config-panel" data-config-panel="voice" hidden>
      <div id="voicePanel"></div>
    </section>
  </div>
</div>
