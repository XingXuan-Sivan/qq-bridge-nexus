<!-- 人格与角色页：卡片骨架与说明文字留在这里，所有控件由 fields.js 生成后渲染进 [data-persona-fields]。 -->
<div class="card span-all">
  <h2>人格与角色</h2>
  <div class="meta">当前人格：<b id="roleText">-</b> <span class="status-badge is-pill" id="roleModeText">读取中…</span></div>
  <div class="layer-note">
    <strong>两层提示词的分工</strong>
    <ol>
      <li><b>仿真提示词</b>（预设内置）：AI 怎么调工具、怎么参与群聊 —— <i>行为与协议</i>。</li>
      <li><b>人格提示词</b>（本页编辑）：AI 是谁、什么性格、怎么说话 —— <i>人设与语气</i>。</li>
    </ol>
    <p>每条消息发给 AI 时，按 <code>仿真提示词 → 人格提示词 → 本轮消息</code> 的顺序拼装。人格层保存即生效；仿真层需重启 DSH。</p>
  </div>
</div>

<div class="card span-all">
  <div class="card-head">
    <h3>人格列表</h3>
    <span class="meta" id="roleListHint"></span>
  </div>
  <div data-persona-fields="toolbar"></div>
  <div id="roleList" class="tile-list">加载中…</div>
</div>
