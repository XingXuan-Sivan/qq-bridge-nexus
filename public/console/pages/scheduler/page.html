<!-- 卡片外壳由 page.js 的 renderCards() 用 components/card/card.js 生成，这里只留宿主。
     宿主用 .page-stack（display:contents）让卡片继续做 main 栅格的直接子项，和注入前一样。
     这几张卡的标题原本是 h3，cardHtml 只产出 h2，所以标题留在 body 顶部，字号仍由 .card h3 管。 -->
<section class="page-stack" data-page="scheduler">
  <div id="schedulerCards" class="page-stack"></div>
</section>
