    <section class="card span-all" data-page="sessions">
      <h2>会话与审批</h2>
      <div class="meta">「会话映射」是桥接当前握着的全部会话：只显示平台侧身份与状态，改名会写回 DSH 侧栏标题；单独指定人格、仿真模式等配置不在这一页改。「审批 / 提问」只读，批准或回答都要去对应 QQ 会话里回复。</div>
      <div class="page-tabs">
        <button class="page-tab active" data-sessions-tab="sessions">会话映射 <span class="meta" id="sessionsTabCount"></span></button>
        <button class="page-tab" data-sessions-tab="pending">审批 / 提问 <span class="meta" id="pendingTabCount"></span></button>
      </div>

      <div class="page-panel" data-sessions-panel="sessions">
        <div class="row u-mt-8">
          <button id="sessionsRefresh">刷新</button>
          <select class="u-w-auto" id="sessionsPlatform">
            <option value="all">全部平台</option>
          </select>
          <select class="u-w-auto" id="sessionsKind">
            <option value="all">全部类型</option>
            <option value="group">仅群聊</option>
            <option value="private">仅私聊</option>
          </select>
          <input type="search" class="search-box search-box--w240" id="sessionsSearch" placeholder="搜索会话、模式或角色…">
          <span class="meta" id="sessionsMeta">加载中…</span>
        </div>
        <div id="sessionList" class="tool-log-table">加载中…</div>
      </div>

      <div class="page-panel" data-sessions-panel="pending" hidden>
        <div class="row u-mt-8">
          <button id="pendingRefresh">刷新</button>
          <span class="meta" id="pendingMeta">加载中…</span>
        </div>
        <div id="pendingList" class="tool-log-table">加载中…</div>
      </div>
    </section>

    <div class="modal-overlay" id="sessionRenameOverlay">
      <div class="modal u-maxw-720" role="dialog" aria-modal="true" aria-labelledby="sessionRenameTitle" tabindex="-1">
        <h3 id="sessionRenameTitle">重命名会话</h3>
        <div class="meta" id="sessionRenameWho"></div>
        <label class="field u-mt-8"><span>标题（最多 60 字，侧栏直接显示）</span>
          <input type="text" id="sessionRenameInput" maxlength="60" placeholder="例如：群聊·喵喵屋｜星苒">
        </label>
        <div class="row u-mt-8">
          <button id="sessionRenameSave">保存</button>
          <button id="sessionRenameCancel">取消</button>
          <span class="meta" id="sessionRenameMsg"></span>
        </div>
      </div>
    </div>
