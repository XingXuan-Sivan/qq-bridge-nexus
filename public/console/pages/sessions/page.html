<section class="card span-all" data-page="sessions">
  <h2>会话与审批</h2>
  <div class="meta">「会话映射」是桥接当前握着的全部会话：只显示平台侧身份与状态，改名会写回 DSH 侧栏标题；单独指定人格、仿真模式等配置不在这一页改。「审批 / 提问」只读，批准或回答都要去对应 QQ 会话里回复。</div>

  <div data-sessions-fields="tabs"></div>

  <div class="page-panel" data-sessions-panel="sessions">
    <div data-sessions-fields="sessionsPanel"></div>
  </div>

  <div class="page-panel" data-sessions-panel="pending" hidden>
    <div data-sessions-fields="pendingPanel"></div>
  </div>
</section>

<div class="modal-overlay" id="sessionRenameOverlay">
  <div class="modal u-maxw-720" data-modal-panel role="dialog" aria-modal="true" aria-labelledby="sessionRenameTitle" tabindex="-1">
    <header class="modal-head">
      <h3 id="sessionRenameTitle">重命名会话</h3>
      <button class="modal-close" type="button" data-modal-close aria-label="关闭">×</button>
    </header>
    <div class="modal-body">
      <div class="meta" id="sessionRenameWho"></div>
      <div data-sessions-fields="rename"></div>
    </div>
    <footer class="modal-foot">
      <span class="modal-status" id="sessionRenameMsg"></span>
      <button id="sessionRenameCancel" class="btn" type="button">取消</button>
      <button id="sessionRenameSave" class="btn primary" type="button">保存</button>
    </footer>
  </div>
</div>
