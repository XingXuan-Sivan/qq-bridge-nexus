      <div class="card span-all">
        <div class="card-head">
          <h2>群聊黑话 / 网络用语库</h2>
          <span class="form-actions-status" id="slangMsg"></span>
        </div>
        <div class="meta">DSH 会从群聊中自动提取疑似黑话候选；二代仿真模式下 AI 也可用 <code>qq_slang_submit</code> 主动提交陌生词。候选可批量送 DSH 深度联网研究，研究结果回到控制台由你删改修正后转正；确认后的词条会写入「黑话提示词」，注入一代/二代 AI 的聊天上下文，成为 AI 可查询和使用的记忆。</div>
      </div>

      <div class="card span-all">
        <div class="card-head">
          <h3>词库</h3>
        </div>

        <div data-slang-fields="tabs"></div>

        <div class="slang-panel active" id="slangPanelCandidate">
          <div data-slang-fields="barCandidate"></div>
          <div id="slangCandidateList" class="slang-list"></div>
        </div>

        <div class="slang-panel" id="slangPanelConfirmed">
          <div data-slang-fields="barConfirmed"></div>
          <div id="slangConfirmedList" class="slang-list"></div>
        </div>

        <div class="slang-panel" id="slangPanelRejected">
          <div data-slang-fields="barRejected"></div>
          <div id="slangRejectedList" class="slang-list"></div>
        </div>
      </div>

      <details class="settings-group span-all" data-group="config">
        <summary>黑话系统参数（可调）</summary>
        <div class="settings-content">
          <div data-slang-fields="config"></div>
        </div>
      </details>
